name: Pack import

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check folder summaries survive import
        run: bash scripts/check-pack-import.sh
